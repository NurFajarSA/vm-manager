name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `vm status`
      description: Replace server names and addresses before pasting.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`vm --version`, `claude --version`, macOS version"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: From ~/.config/vm-manager/vm-manager.log. It never contains passwords; replace server names and addresses.
      render: text
